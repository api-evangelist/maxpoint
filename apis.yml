name: MaxPoint
description: >-
  MaxPoint (MaxPoint Interactive, Inc.) was a Morrisville, North Carolina marketing
  technology company that built a hyperlocal programmatic advertising platform,
  matching neighborhood-level ("Digital Zip") consumer intelligence to online media
  buys so brands and retailers could tie digital advertising to in-store sales. It
  was funded by Trinity Ventures among others, went public on the NYSE as MXPT in
  March 2015, and was acquired by Valassis Communications in August 2017 for roughly
  $95 million, where it was folded into Valassis Digital. Valassis was later unified
  under the Vericast brand, which divested its adtech business in 2024. MaxPoint no
  longer operates as an independent company or product line: maxpoint.com and
  maxpointinteractive.com are dead hosts returning HTTP 403 on every path with a
  mismatched TLS certificate, api./developer./docs.maxpoint.com do not resolve, the
  github.com/maxpoint organization is empty and forwards to a handle now owned by an
  unrelated company, and valassisdigital.com is NXDOMAIN. There is no public API,
  developer program, or machine-readable contract to profile.
